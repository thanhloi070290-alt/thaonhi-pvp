<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9b5f2"/><stop offset=".55" stop-color="#d7bdf2"/><stop offset="1" stop-color="#ffd9bd"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6c8ef"/><stop offset="1" stop-color="#6e9ad8"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e6cd"/><stop offset="1" stop-color="#ebcfa9"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#fff4d8" stop-opacity="1"/><stop offset="1" stop-color="#ffd9bd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bub" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".4" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#bfe0ff" stop-opacity=".4"/>
    </radialGradient>
    <path id="leaf" d="M500 960 C440 880 340 890 280 960 C380 930 450 950 500 960Z"/>
  </defs>
  <style>
    .b { animation: up 16s linear infinite; }
    @keyframes up { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: .95; } 90% { opacity: .95; } 100% { transform: translateY(-260px); opacity: 0; } }
    .sway { animation: sway 9s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-36px); } }
    @media (prefers-reduced-motion: reduce) { .b, .sway { animation: none; } }
  </style>

  <rect width="1600" height="1600" fill="url(#sky)"/>
  <circle cx="800" cy="900" r="420" fill="url(#sun)"/>

  <!-- mây -->
  <g fill="#fff" opacity=".6">
    <ellipse cx="380" cy="420" rx="170" ry="40"/><ellipse cx="470" cy="395" rx="110" ry="42"/><ellipse cx="300" cy="400" rx="90" ry="32"/>
    <ellipse cx="1180" cy="300" rx="190" ry="42"/><ellipse cx="1260" cy="276" rx="110" ry="40"/><ellipse cx="1090" cy="285" rx="90" ry="30"/>
    <ellipse cx="820" cy="640" rx="210" ry="30" opacity=".7"/>
  </g>

  <!-- biển -->
  <rect y="880" width="1600" height="520" fill="url(#sea)"/>
  <g class="sway" fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M-100 940 q100 -22 200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0" stroke-width="5" opacity=".35"/>
    <path d="M-100 1010 q120 -26 240 0 t240 0 t240 0 t240 0 t240 0 t240 0 t240 0 t240 0" stroke-width="7" opacity=".4"/>
    <path d="M-100 1100 q140 -32 280 0 t280 0 t280 0 t280 0 t280 0 t280 0 t280 0" stroke-width="9" opacity=".5"/>
    <path d="M-100 1200 q160 -36 320 0 t320 0 t320 0 t320 0 t320 0 t320 0" stroke-width="11" opacity=".55"/>
  </g>

  <!-- bờ cát + bọt sóng -->
  <path d="M0 1330 Q200 1290 400 1330 T800 1330 T1200 1330 T1600 1330 V1600 H0Z" fill="#fff" opacity=".7"/>
  <path d="M0 1362 Q200 1326 400 1362 T800 1362 T1200 1362 T1600 1362 V1600 H0Z" fill="url(#sand)"/>
  <path d="M0 1362 Q200 1326 400 1362 T800 1362 T1200 1362 T1600 1362" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".95"/>

  <!-- cọ -->
  <g fill="#8f86be" stroke="#8f86be">
    <path d="M470 1362 C482 1210 440 1090 500 960" fill="none" stroke="#a090c0" stroke-width="22" stroke-linecap="round"/>
    <use href="#leaf" transform="rotate(-30 500 960)"/><use href="#leaf"/><use href="#leaf" transform="rotate(30 500 960)"/><use href="#leaf" transform="rotate(62 500 960)"/>
    <g transform="translate(1000 0) scale(-1 1)">
      <use href="#leaf" transform="rotate(-30 500 960)"/><use href="#leaf"/><use href="#leaf" transform="rotate(30 500 960)"/><use href="#leaf" transform="rotate(62 500 960)"/>
    </g>
  </g>

  <!-- chòi lá -->
  <rect x="1073" y="1040" width="14" height="322" fill="#a47e68"/>
  <path d="M900 1140 L1080 1000 L1260 1140 Q1080 1110 900 1140Z" fill="#c9a58f"/>
  <path d="M900 1140 Q1080 1110 1260 1140 L1248 1156 Q1080 1128 912 1156Z" fill="#b08a74"/>
  <path d="M1080 1000 L1030 1128 M1080 1000 L1130 1128 M1080 1000 L1080 1124" stroke="#a47e68" stroke-width="5" opacity=".6" fill="none"/>

  <!-- bọt bay -->
  <g fill="url(#bub)" stroke="#fff" stroke-opacity=".7" stroke-width="2">
    <circle class="b" cx="180" cy="1400" r="34" style="animation-delay:0s"/>
    <circle class="b" cx="330" cy="1500" r="20" style="animation-delay:-4s"/>
    <circle class="b" cx="620" cy="1450" r="46" style="animation-delay:-9s"/>
    <circle class="b" cx="760" cy="1540" r="16" style="animation-delay:-2s"/>
    <circle class="b" cx="900" cy="1430" r="28" style="animation-delay:-12s"/>
    <circle class="b" cx="1190" cy="1480" r="40" style="animation-delay:-6s"/>
    <circle class="b" cx="1340" cy="1400" r="22" style="animation-delay:-10s"/>
    <circle class="b" cx="1450" cy="1530" r="30" style="animation-delay:-14s"/>
    <circle class="b" cx="520" cy="1330" r="14" style="animation-delay:-7s"/>
    <circle class="b" cx="1020" cy="1320" r="18" style="animation-delay:-3s"/>
  </g>
</svg>
